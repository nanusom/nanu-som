<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nanu Som · Orçamentos</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<script src="dados-iniciais.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#f2f2f0;--card:#fff;--ink:#17191d;--mut:#6a707a;--line:#e3e4e1;--ac:#f81405;--acink:#fff;--nav:#000;--navink:#c9ced6;--danger:#c0392b;--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--card:#191c21;--ink:#eceef1;--mut:#9aa1ac;--line:#2a2e35;--nav:#000;--field:#12151a}}
:root[data-theme="dark"]{--bg:#101215;--card:#191c21;--ink:#eceef1;--mut:#9aa1ac;--line:#2a2e35;--nav:#000;--field:#12151a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;letter-spacing:.2px;margin:0}
h1{font-size:32px;font-style:italic;font-weight:700}h2{font-size:21px;font-weight:700}
.app{display:flex;min-height:100vh}
.side{width:220px;background:var(--nav);color:var(--navink);padding:20px 12px;position:sticky;top:0;align-self:flex-start;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:#fff;font:700 24px "Barlow Condensed",sans-serif;letter-spacing:1px}
.logo img{width:100%;display:block;border-radius:6px}.logo i{display:none;width:26px;height:26px;border-radius:50%;border:3px solid var(--ac);position:relative}
.logo i:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--ac)}
.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500}
.side a b{width:18px;text-align:center;font-weight:400}
.side a.on{background:#262a31;color:#fff;box-shadow:inset 3px 0 0 var(--ac)}
.side a.cta{background:var(--ac);color:var(--acink);font-weight:600;margin:6px 0}
.main{flex:1;min-width:0;padding:26px clamp(14px,3vw,36px);max-width:1100px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut)}.sm{font-size:13px}
.btn{font:600 14px Barlow,sans-serif;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.btn.danger{color:var(--danger)}.btn.sm{padding:6px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:0}
input,select,textarea{font:15px Barlow,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);width:100%;min-width:0}
.stat{border-top:3px solid var(--ac)}.stat .num{font-size:34px;line-height:1.1}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#ddd;color:#222;white-space:nowrap}
.s0{background:#e4e5e8}.s1{background:#cfe2f7}.s2{background:#cdeccf}.s3{background:#fbe3b0}.s4{background:#d3d9ff}.s5{background:#f6cfcb}
.qrow{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);text-decoration:none;color:inherit;flex-wrap:wrap}
.qrow:first-child{border-top:0}.qrow .grow{flex:1;min-width:140px}
.lit{background:var(--bg);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lit b{font:700 22px "Barlow Condensed",sans-serif}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.res button{max-width:100%}
.il{display:grid;grid-template-columns:1fr 70px 100px 90px 34px;gap:8px;align-items:center;margin-top:8px}
.tot{font:700 30px "Barlow Condensed",sans-serif}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.doc{background:#fff;color:#111;border:1px solid #ddd;border-radius:6px;padding:0;overflow:hidden;font-size:14px}
.doc h1{font-size:34px;letter-spacing:2px}.doc .bar{height:4px;background:#f81405;margin:0}
.doc table{width:100%;border-collapse:collapse}.doc th,.doc td{padding:8px 6px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
.doc th{font-size:12px;color:#555}.doc .r{text-align:right;white-space:nowrap}
.doc .bx{border:1px solid #ddd;border-left:4px solid #f81405;padding:10px 12px;margin:10px 0}
.doc .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:6px}
.doc .kv span{display:block;font-size:11px;color:#666}
.doc .tt{display:flex;justify-content:space-between;padding:4px 0}.doc .grand{font:700 26px "Barlow Condensed",sans-serif;border-top:2px solid #111;margin-top:6px;padding-top:8px}
.top{display:none;position:sticky;top:0;z-index:6;background:#000;padding:6px 12px;border-bottom:3px solid var(--ac)}.top img{height:44px;display:block}
.hero{background:#000;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;border-bottom:4px solid var(--ac)}.hl{height:64px;max-width:70%}.hm{display:none;color:#fff;font-size:26px}
.dh{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px clamp(14px,3vw,28px)}.dh img{height:64px;max-width:100%}
.dm{text-align:right;font-size:13px;line-height:1.5}.dm b{font:italic 700 28px "Barlow Condensed",sans-serif}.dt{color:#fff;font:600 13px Barlow,sans-serif;letter-spacing:1px;text-transform:uppercase}
.db{padding:clamp(14px,3.5vw,32px)}.lb{font-size:12px;color:#666}
.dcl{background:#f5f5f4;border-left:4px solid #000;padding:10px 14px;border-radius:2px}
.sec{font:italic 700 19px "Barlow Condensed",sans-serif;margin:20px 0 6px;border-bottom:2px solid #000;padding-bottom:3px}
.tw{max-width:320px;margin-left:auto;margin-top:14px}
.gt{display:flex;justify-content:space-between;background:#000;color:#fff;padding:10px 14px;margin-top:6px;font:700 26px "Barlow Condensed",sans-serif;border-left:5px solid var(--ac)}
.df{background:#000;color:#fff;text-align:center;padding:10px;font-size:13px;border-top:4px solid var(--ac)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#000;color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:20;border:1px solid var(--ac);max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.lg .side,.lg .top{display:none!important}.lg .main{max-width:none;padding:0}
.lgw{min-height:100vh;display:grid;place-items:center;padding:16px}.lgc{width:min(400px,100%)}
.scroll{overflow-x:auto}
@media(max-width:800px){
.app{display:block}input,select,textarea,.btn{min-height:46px;font-size:16px}.top{display:block}.hl{display:none}.hm{display:block}
.side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;z-index:5;border-top:1px solid #2a2e35}
.logo{display:none}.side a{flex:1;flex-direction:column;gap:0;padding:6px 2px;font-size:11px;text-align:center}
.side a.cta{margin:0}.side a.on{box-shadow:none}
.main{padding-bottom:100px}
.g3,.g4{grid-template-columns:repeat(2,1fr)}
.il{grid-template-columns:1fr 1fr}.il .t{grid-column:1/-1}
}
@media(max-width:480px){.g2{grid-template-columns:1fr}h1{font-size:26px}}
@media print{
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.top{display:none!important}
:root{padding:0}body{background:#fff}.side,.noprint{display:none!important}.main{padding:0;max-width:none}.doc{border:0;padding:0}
}
.imp-note{margin:-6px 0 12px}
</style>
</head>

/* ===== Cálculos (módulo isolado: ampliar com cálculos acústicos aqui) ===== */
const Calc={
 // medidas em cm, espessura em mm; descontadas as duas paredes de cada eixo
 liters(c,a,p,e=0){const t=2*(+e||0)/10,f=v=>Math.max(0,(+v||0)-t);return f(c)*f(a)*f(p)/1000},
 box:b=>(+b.qty||0)*(+b.price||0),
 // ponto de extensão: divisórias, dutos, deslocamento, volume líquido, tipo de caixa
 volume:b=>({gross:(+b.c||0)*(+b.a||0)*(+b.p||0)/1000,internal:Calc.liters(b.c,b.a,b.p,b.esp),net:null}),
 item:i=>(+i.qty||0)*(+i.price||0),
 sub:q=>q.boxes.reduce((s,b)=>s+Calc.box(b),0)+q.items.reduce((s,i)=>s+Calc.item(i),0),
 total:q=>Math.max(0,Calc.sub(q)-(+q.discount||0)),
 saldo:q=>Math.max(0,Calc.total(q)-(+q.entrada||0))
};
const lit=b=>Calc.liters(b.c,b.a,b.p,b.esp).toLocaleString('pt-BR',{maximumFractionDigits:1})+' L';

function route(){

 $('#nav').innerHTML='<div class="logo"><img src="'+LOGO+'" alt="Nanu Som"></div>'+NAV.map(([h,g,l,c])=>`<a href="#/${h}" class="${c||''} ${(r||'')===h||(h==='clientes'&&r==='cliente')||(h==='orcamentos'&&['orcamento','editar'].includes(r))?'on':''}"><b>${g}</b>${l}</a>`).join('');
 $('#tl').src=LOGO;
 const V={'':Dashboard,orcamentos:List,novo:()=>Editor(null,id),clientes:Clients,cliente:()=>ClientDetail(id),editar:()=>Editor(id),orcamento:()=>Detail(id),produtos:()=>Catalog('produto'),servicos:()=>Catalog('servico'),config:Settings};
 $('#main').innerHTML=(V[r||'']||Dashboard)();window.scrollTo(0,0);
 if(r==='novo'||r==='editar')upd();
 if(after){const f=after;after=null;f()}
}

/* ===== Dashboard ===== */
function qRow(q){return `<a class="qrow" href="#/orcamento/${q.id}"><div class="grow"><b>#${q.num} · ${esc(q.client.name)}</b><div class="mut sm">${fmtDate(q.date)}</div></div><span class="badge s${STATUS.indexOf(q.status)}">${q.status}</span><b>${brl(Calc.total(q))}</b></a>`}
function Dashboard(){
 const Q=DB.quotes,n=s=>Q.filter(q=>s.includes(q.status)).length;
 const won=Q.filter(q=>['Aprovado','Em produção','Finalizado'].includes(q.status)).reduce((s,q)=>s+Calc.total(q),0);
 const sv=x=>brl(Q.filter(q=>q.status===x).reduce((a,q)=>a+Calc.total(q),0)),st=(l,v)=>`<div class="card stat"><div class="mut sm">${l}</div><div class="num">${v}</div></div>`;
 return `<div class="hero"><img class="hl" src="${LOGO}" alt="Nanu Som"><h1 class="hm">Início</h1><a class="btn pri" href="#/novo">Novo orçamento</a></div>
 <div class="grid g4" style="margin-bottom:14px">${st('Total de orçamentos',Q.length)}${st('Em aberto',n(['Rascunho','Enviado']))}${st('Aprovados',n(['Aprovado']))}${st('Em produção',n(['Em produção']))}${st('Finalizados',n(['Finalizado']))}${st('Valor aprovado',sv('Aprovado'))}${st('Valor em produção',sv('Em produção'))}</div>
 <div class="row" style="margin-bottom:14px"><a class="btn" href="#/clientes">Clientes</a><a class="btn" href="#/produtos">Produtos</a><a class="btn" href="#/servicos">Serviços</a></div>
 <div class="card"><div class="row between"><h2>Orçamentos recentes</h2><a href="#/orcamentos" class="sm">Ver todos</a></div>
 ${Q.length?[...Q].reverse().slice(0,6).map(qRow).join(''):'<div class="empty">Nenhum orçamento ainda.<br><br><a class="btn pri" href="#/novo">Criar o primeiro orçamento</a></div>'}</div>`;
}

 <div class="card"><div class="grid g2"><input placeholder="Buscar por cliente ou número" value="${esc(filt.q)}" oninput="filt.q=this.value;fl()">

 <div id="lst" style="margin-top:8px"></div></div>`+'<img src="data:," onerror="fl();this.remove()" style="display:none">';

function fl(){
 const t=filt.q.toLowerCase(),r=[...DB.quotes].reverse().filter(q=>(!filt.s||q.status===filt.s)&&(!t||(q.client.name+q.num).toLowerCase().includes(t)));
 $('#lst').innerHTML=r.length?r.map(qRow).join(''):'<div class="empty">Nenhum orçamento encontrado.</div>';
}

 draft=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),num:null,client:cl?{name:cl.name,phone:cl.phone}:{name:'',phone:''},clientId:cid||null,date:today(),status:'Rascunho',boxes:[],items:[],discount:0,obs:''};

function boxCard(b){const i=b.id;

/* ===== Ações do orçamento ===== */
function setSt(id,s){const q=Repo.quotes.get(id);q.status=s;Repo.quotes.save(q);const b=$('#stb');if(b){b.textContent=s;b.className='badge s'+STATUS.indexOf(s)}toast('Status: '+s)}
function dup(id){const o=JSON.parse(JSON.stringify(Repo.quotes.get(id)));o.id=uid();o.num=Repo.nextNum();o.date=today();o.status='Rascunho';o.boxes.forEach(b=>b.id=uid());o.items.forEach(i=>i.id=uid());
 Repo.quotes.save(o);toast('Orçamento duplicado');go('orcamento/'+o.id)}
function wa(id){const q=Repo.quotes.get(id);let ph=dg(q.client.phone);if(!ph){toast('Cliente sem telefone cadastrado');return}if(ph.length<=11)ph='55'+ph;
 const m=`Olá, ${q.client.name}.\n\nSegue o orçamento nº ${q.num} da ${DB.settings.name}.\n\nValor total: ${brl(Calc.total(q))}\n\nVou te enviar o PDF do orçamento em seguida.`;
 const a=document.createElement('a');a.href='https://wa.me/'+ph+'?text='+encodeURIComponent(m);a.target='_blank';a.rel='noopener';a.click()}

/* ===== Backup e numeração ===== */
function setNext(el){const v=Number(el.value),bad=!Number.isInteger(v)||v<1;
 if(bad||DB.quotes.some(q=>+q.num===v)){toast(bad?'Informe um número inteiro positivo':'Já existe um orçamento com esse número');el.value=DB.settings.next;return}
 DB.settings.next=v;Store.save();toast('Número atualizado')}
async function exportBackup(){const name='nanu-som-backup-'+today()+'.json',text=Store.exportText();
 try{const c=window.claude&&await claude.use('downloads');if(c){await c.save({filename:name,data:text});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function importBackup(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();
 r.onerror=()=>toast('Não foi possível restaurar este backup. O arquivo é inválido ou está corrompido.');
 r.onload=()=>{let d;try{d=Store.parse(r.result)}catch(e){toast('Não foi possível restaurar este backup. O arquivo é inválido ou está corrompido.');return}
  if(!confirm('A restauração substituirá os dados atuais deste navegador. Deseja continuar?'))return;
  try{localStorage.setItem(Store.key+'.prev',JSON.stringify(DB))}catch(e){}
  const base=seed().settings;for(const k in base)if(d.settings[k]===undefined)d.settings[k]=base[k];
  DB=d;if(!Store.save()){return}route();toast('Restauração concluída')};r.readAsText(f)}

/* ===== Configurações ===== */
function Settings(){const S=DB.settings;
 const f=(k,l,t='text')=>fld(l,`<input type="${t}" value="${esc(S[k])}" oninput="DB.settings.${k}=${t==='number'?'+this.value':'this.value'}">`);
 return `<h1 style="margin-bottom:16px">Configurações</h1><div class="card"><h2 style="margin-bottom:10px">Dados da empresa</h2><div class="grid g2">${f('name','Nome no orçamento')}${f('phone','Telefone / WhatsApp')}${f('insta','Instagram')}${f('address','Endereço')}${f('validity','Validade do orçamento (dias)','number')}</div>
 <div style="margin-top:12px">${fld('Condições e rodapé do orçamento',`<textarea rows="3" oninput="DB.settings.terms=this.value">${esc(S.terms)}</textarea>`)}</div>
 <div style="margin-top:12px;max-width:240px">${fld('Próximo número de orçamento',`<input type="number" min="1" step="1" value="${S.next}" onchange="setNext(this)">`)}</div>
 <div class="row" style="margin-top:14px"><button class="btn pri" onclick="Store.save();toast('Configurações salvas')">Salvar configurações</button></div></div>
 ${seedCard()}<div class="card" style="margin-top:14px"><h2 style="margin-bottom:8px">Backup dos dados</h2><p class="mut sm" style="margin-bottom:10px">Os dados deste sistema ficam armazenados neste navegador/dispositivo. Eles não são sincronizados automaticamente com outros computadores. Faça o backup regularmente.</p><div class="row"><button class="btn pri" onclick="exportBackup()">Exportar backup</button><button class="btn" onclick="$('#bkf').click()">Importar backup</button><input id="bkf" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></div></div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="Auth.logout();route()">Sair</button></div><p class="mut sm">O login é verificado no próprio navegador e não substitui uma autenticação com servidor. Limpar os dados do navegador apaga tudo que não tiver backup.</p>`;
}

/* ===== Dados iniciais (orçamentos importados): mescla segura, uma vez por versão =====
   - Nunca apaga nem sobrescreve nada. Só ADICIONA o que ainda não existe.
   - Antes de mexer, guarda uma cópia dos dados atuais no próprio navegador.
   - Reconhece o que já existe pelo código do orçamento e também pelo conteúdo (cliente + itens + valores).
   - Se qualquer passo falhar, os dados atuais ficam exatamente como estavam. */
const Seed={ck:'nanusom.v1.dados-iniciais',
 ctl(){try{const r=localStorage.getItem(this.ck);if(!r)return{versoes:{},vistos:[]};const o=JSON.parse(r);if(!o||typeof o!=='object')throw 0;o.versoes=o.versoes||{};o.vistos=Array.isArray(o.vistos)?o.vistos:[];return o}
  catch(e){try{const r=localStorage.getItem(this.ck);if(r)localStorage.setItem(this.ck+'.ilegivel-'+Date.now(),r)}catch(_){}return{versoes:{},vistos:[],recriado:true}}},
 fp(q){const n=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' '),v=x=>(x===''||x==null)?0:(+x||0),ph=dg(q.client&&q.client.phone);
  return JSON.stringify([ph.length>=10?ph:n(q.client&&q.client.name),(q.boxes||[]).map(b=>[n(b.model),v(b.c),v(b.a),v(b.p),n(b.material),n(b.acab),v(b.qty),v(b.price)]),(q.items||[]).map(i=>[n(i.name),v(i.qty),v(i.price)]),v(q.discount)])},
 run(){const S=window.NANU_SEED;if(!S||!Array.isArray(S.orcamentos)||!S.versao)return null;
  const ctl=this.ctl();if(ctl.versoes[S.versao])return null;
  try{
   const raw=localStorage.getItem(Store.key);
   if(raw){const k=Store.key+'.antes-'+S.versao;localStorage.setItem(k,raw);if(localStorage.getItem(k)!==raw)throw new Error('cópia de segurança não confirmada')}
   const D=JSON.parse(JSON.stringify(DB));D.clients=D.clients||[];D.quotes=D.quotes||[];
   const R={versao:S.versao,em:new Date().toISOString(),total:S.orcamentos.length,novos:0,jaExistia:0,removidosPeloUsuario:0,conteudoIgual:[],invalidos:[],renumerados:[],clientesNovos:0,clientesReaproveitados:0};
   const vistos=new Set(ctl.vistos),ids=new Set(D.quotes.map(q=>q.id)),fps=new Map(D.quotes.map(q=>[this.fp(q),q])),used=new Set(D.quotes.map(q=>+q.num).filter(Number.isFinite));
   const byPh=new Map(),byId=new Map(D.clients.map(c=>[c.id,c])),reuse=new Set(),sc=new Map((S.clientes||[]).map(c=>[c.id,c]));
   D.clients.forEach(c=>{const p=dg(c.phone);if(p.length>=10&&!byPh.has(p))byPh.set(p,c)});
   for(const e of S.orcamentos){
    if(!e||!e.id||!/^\d+$/.test(String(e.num))||!e.client||!Array.isArray(e.boxes)||!Array.isArray(e.items)){R.invalidos.push((e&&e.id)||'?');continue}
    const grupo=!!(e.importado&&e.importado.grupo);   // PDFs que repetem o mesmo código com conteúdos diferentes: cada versão é comparada pelo conteúdo
    if(ids.has(e.id)&&!grupo){R.jaExistia++;vistos.add(e.id);continue}
    if(!ids.has(e.id)&&vistos.has(e.id)){R.removidosPeloUsuario++;continue}
    const f=this.fp(e);if(fps.has(f)){R.conteudoIgual.push({id:e.id,igualAoNumero:fps.get(f).num});vistos.add(e.id);continue}
    const ph=dg(e.client.phone);let cl=null;
    if(ph.length>=10&&byPh.has(ph)){cl=byPh.get(ph);reuse.add(cl.id)}
    else{const c0=sc.get(e.clientId);if(byId.has(e.clientId))cl=byId.get(e.clientId);else if(c0){cl={...c0};D.clients.push(cl);byId.set(cl.id,cl);if(ph.length>=10)byPh.set(ph,cl);R.clientesNovos++}}
    const q=JSON.parse(JSON.stringify(e));q.clientId=cl?cl.id:null;
    if(ids.has(q.id)){const t=(q.importado&&q.importado.impressoEm)||'';q.id=q.id+'-v'+t.slice(11,13)+t.slice(14,16);if(q.importado)q.importado.variante=true;
     (q.boxes||[]).forEach((b,k)=>{b.id=q.id+'-b'+(k+1)});(q.items||[]).forEach((i,k)=>{i.id=q.id+'-i'+(k+1)})}
    const n=+q.num;
    if(used.has(n)){const m=Math.max(Math.floor(+D.settings.next)||1,(used.size?Math.max(...used):0)+1);q.num=String(m).padStart(4,'0');used.add(m);D.settings.next=m+1;R.renumerados.push({id:q.id,de:String(e.num),para:q.num,cliente:q.client.name})}
    else used.add(n);
    D.quotes.push(q);ids.add(q.id);fps.set(f,q);vistos.add(q.id);R.novos++}
   R.clientesReaproveitados=reuse.size;
   D.settings.next=Math.max(Math.floor(+D.settings.next)||1,(used.size?Math.max(...used):0)+1);
   localStorage.setItem(Store.key,JSON.stringify(D));
   DB=D;
   try{ctl.versoes[S.versao]=R;ctl.vistos=[...vistos];delete ctl.recriado;localStorage.setItem(this.ck,JSON.stringify(ctl))}catch(e){}
   return R}
  catch(e){return{erro:String((e&&e.message)||e)}}}};
function seedCard(){const c=Seed.ctl(),vs=Object.values(c.versoes||{});if(!vs.length)return '';const R=vs[vs.length-1];
 const when=new Date(R.em).toLocaleString('pt-BR');
 return `<div class="card" style="margin-top:14px"><h2 style="margin-bottom:8px">Orçamentos importados</h2><p class="mut sm">Importação inicial de ${when}: <b>${R.novos}</b> orçamento(s) adicionado(s) de ${R.total} no arquivo de dados; ${R.jaExistia} já existiam neste navegador${R.conteudoIgual.length?'; '+R.conteudoIgual.length+' tinham conteúdo igual a um já existente':''}${R.removidosPeloUsuario?'; '+R.removidosPeloUsuario+' foram removidos por você antes e não voltaram':''}${R.invalidos.length?'; '+R.invalidos.length+' inválido(s)':''}. Clientes novos: ${R.clientesNovos}; clientes já existentes reaproveitados: ${R.clientesReaproveitados}.${R.renumerados.length?'<br>Renumerados para não repetir número: '+R.renumerados.map(r=>esc(r.cliente)+' '+esc(r.de)+' → '+esc(r.para)).join('; ')+'.':''} Uma cópia dos dados que existiam antes foi guardada neste navegador.</p></div>`}

{const R=Seed.run();
 if(Store.erroLeitura)setTimeout(()=>toast('Os dados salvos neste navegador estavam ilegíveis e foram preservados à parte. Importe um backup, se tiver.'),400);
 else if(R&&R.erro)setTimeout(()=>toast('Não foi possível importar os orçamentos iniciais. Seus dados não foram alterados.'),400);
 else if(R&&R.novos>0)setTimeout(()=>toast('Importação inicial: '+R.novos+' orçamento(s) adicionado(s).'),400)}
route();
</script>
